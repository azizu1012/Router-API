name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Advisory, same posture as the Trustabl job: report, never block. A gate that
# goes red on an unrelated commit trains people to ignore it, and then it
# protects nothing. Secrets land in a force-push anyway, not through a red X.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: secret-scan-${{ github.ref }}
      cancel-in-progress: true
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Only files git tracks. Scanning the working tree would report the
      # contents of .env, logs/ and Cert/ — real keys that are correctly
      # gitignored and that CI can never see.
      - name: Scan tracked files for credentials
        run: |
          python scripts/scan_secrets.py --git --json > findings.json || true
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("findings.json").read_text() or "[]")
          if not data:
              print("No secrets found.")
          else:
              for f in data:
                  print(f"[{f['severity'].upper():8}] {f['path']}:{f['line']}  {f['rule']}")
                  print(f"           {f['preview']}")
              print(f"\n{len(data)} finding(s)")
          PY

      # A finding in a file that is not yet tracked still matters: it is one
      # `git add` away from being published.
      - name: Summary
        run: |
          {
            echo "### Secret scan"
            echo ""
            echo '```'
            cat findings.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show human-readable report
        run: python scripts/scan_secrets.py --git --warn-only