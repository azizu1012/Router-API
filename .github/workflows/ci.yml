name: CI

on:
  push:
    branches: [main]
  pull_request:

# Unlike the two scanners, this one blocks. A test that can fail but never
# blocks is a note in a file, not a gate — and the whole point of having 890
# tests is that they stop a bad commit. The advisory workflows stay advisory
# because they report on code that may be fine; this one reports on code that is
# already broken.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test should cost five minutes, not the default six hours.
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # Pinned by SHA, not tag. A tag is mutable, so `@v4` can point at a
      # different commit tomorrow, and this job holds a token while it runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Matches the versions the advisory workflows already use, so a
          # difference in test results cannot be blamed on the interpreter.
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # No `|| true` anywhere in this file. The exit code is the gate.
      - name: Run tests
        run: python -m pytest -q

      - name: Audit the HTTP surface
        run: python scripts/scan_security.py