<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Router API architecture</title>
  <desc id="desc">Clients connect to protocol adapters, resilient routing, guardrails, and provider backends.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="70" r="180" fill="#7c3aed" opacity=".12"/><circle cx="115" cy="560" r="220" fill="#06b6d4" opacity=".09"/>
  <text x="70" y="74" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">Router API</text>
  <text x="70" y="108" fill="#bae6fd" font-family="Segoe UI,Arial,sans-serif" font-size="16">One gateway for compatible clients, resilient routing, and provider pools</text>
  <g filter="url(#shadow)"><rect x="70" y="180" width="220" height="250" rx="18" fill="#111827" stroke="#334155"/>
    <text x="100" y="220" fill="#67e8f9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">CLIENTS</text>
    <text x="100" y="268" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">Claude Code</text><text x="100" y="310" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">OpenCode / Cline</text><text x="100" y="352" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">Gemini native</text><text x="100" y="394" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="14">Anthropic · OpenAI · MCP</text>
  </g>
  <g filter="url(#shadow)"><rect x="350" y="180" width="240" height="250" rx="18" fill="#172554" stroke="#38bdf8" stroke-opacity=".55"/>
    <text x="380" y="220" fill="#67e8f9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">ROUTING CORE</text><text x="380" y="270" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">Protocol adapters</text><text x="380" y="310" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">PoolManager</text><text x="380" y="350" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">Model + key resolver</text><text x="380" y="394" fill="#bae6fd" font-family="Segoe UI,Arial,sans-serif" font-size="14">retry · cooldown · circuit breaker</text>
  </g>
  <g filter="url(#shadow)"><rect x="650" y="180" width="220" height="250" rx="18" fill="#111827" stroke="#334155"/>
    <text x="680" y="220" fill="#c4b5fd" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">GUARDRAILS</text><text x="680" y="268" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">RPM / TPM / RPD</text><text x="680" y="310" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">Account isolation</text><text x="680" y="352" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600">SQLite state</text><text x="680" y="394" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="14">live dashboard telemetry</text>
  </g>
  <g filter="url(#shadow)"><rect x="930" y="180" width="200" height="250" rx="18" fill="#111827" stroke="#334155"/>
    <text x="960" y="220" fill="#67e8f9" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">BACKENDS</text><text x="960" y="275" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">Gemini pool</text><text x="960" y="320" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">Custom endpoints</text><text x="960" y="365" fill="#f8fafc" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600">DuckDuckGo</text><text x="960" y="410" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="14">one stable client contract</text>
  </g>
  <path d="M292 305 H340 M592 305 H640 M872 305 H920" stroke="url(#accent)" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="70" y="515" fill="#e2e8f0" font-family="Segoe UI,Arial,sans-serif" font-size="16">Built for long-running agent sessions: recover from provider failures without changing the client.</text><rect x="70" y="545" width="410" height="4" rx="2" fill="url(#accent)"/>
</svg>
